name: Update Local Time

on:
  schedule:
    - cron: '0 * * * *' # Runs hourly
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-time:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update 12-Hour Local Time in README
        run: |
          TIME_12HR=$(TZ="Asia/Kolkata" date +"%I:%M %p IST")
          echo "Updating time to $TIME_12HR"
          # Update the time badge string in README.md
          sed -i -E "s/Local%20Time-[0-9]{2}%3A[0-9]{2}%20(AM|PM)%20IST/Local%20Time-${TIME_12HR// /%20}/g" README.md || true
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update local time to $TIME_12HR" && git push)
