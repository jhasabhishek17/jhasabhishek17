name: Update Local Time & Weather

on:
  schedule:
    - cron: '0 * * * *' # Runs hourly
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update 12-Hour Local Time & Weather in README
        run: |
          TIME_12HR=$(TZ="Asia/Kolkata" date +"%I:%M %p IST")
          TEMP=$(curl -s "https://api.open-meteo.com/v1/forecast?latitude=28.6139&longitude=77.209&current_weather=true" | python3 -c "import sys, json; print(round(json.load(sys.stdin)['current_weather']['temperature']))")
          
          echo "Updating Time to: $TIME_12HR, Weather to: ${TEMP}°C"
          
          # Replace time badge string in README.md
          sed -i -E "s/Local%20Time-[0-9]{2}%3A[0-9]{2}%20(AM|PM)%20IST/Local%20Time-${TIME_12HR// /%20}/g" README.md || true
          
          # Replace weather badge string in README.md
          sed -i -E "s/Live%20Weather-[0-9]+%C2%B0C/Live%20Weather-${TEMP}%C2%B0C/g" README.md || true
          
          git config user.name "Abhishek Jha"
          git config user.email "jhasabhishek17@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update time ($TIME_12HR) and weather (${TEMP}°C)" && git push)
